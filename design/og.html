<!doctype html>
<!-- Source of site/og.png (1200x630). Open at 1200x630 and screenshot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../site/styles.css">
<style>
  @font-face { font-family: "Newsreader"; src: url("../site/fonts/newsreader-latin.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Inter"; src: url("../site/fonts/inter-latin.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../site/fonts/ibm-plex-mono-400-latin.woff2") format("woff2"); font-weight: 400; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .card { width: 1200px; height: 630px; padding: 44px 56px 40px; display: flex; flex-direction: column; }
  .head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 14px; border-bottom: 1px solid #000; }
  .head .wordmark { font-size: 30px; }
  .head .eyebrow { font-size: 14px; }
  .body { flex: 1; display: grid; grid-template-columns: 520px 1fr; gap: 44px; align-items: center; }
  .body h1 { font-size: 64px; margin: 0; line-height: 1.02; text-wrap: wrap; }
  .body img { width: 100%; }
  .body pre { font-size: 15px; padding-top: 12px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; border-top: 1px solid #d9d9d9; }
  .foot .eyebrow { font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="wordmark">openmode</span>
    <span class="eyebrow">Open source · CLI and MCP server · MIT</span>
  </div>
  <div class="body">
    <h1>Video editing and rendering for coding agents.</h1>
    <div>
      <img src="../site/img/look-sheet.jpg" alt="">
      <pre>Video: 16s, 1920x1080, 30 fps, h264, 15.6 MB
<mark>Silences: 5-7s</mark>   <mark>Black: 5-6.5s</mark></pre>
    </div>
  </div>
  <div class="foot">
    <span class="eyebrow">openmode.ai</span>
    <span class="eyebrow quiet">look · render · versions</span>
  </div>
</div>
</body>
</html>
